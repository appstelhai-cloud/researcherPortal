<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>פורטל חוקר – רשות המחקר</title>
  <script>try{var d=document.documentElement,s=localStorage;d.dataset.theme=s.getItem('rp-theme')==='light'?'light':'dark';if(sessionStorage.getItem('rp-static')==='1'||/[?&]static=1/.test(location.search))d.dataset.static='1';if(s.getItem('rp-sidebar')==='hidden')d.dataset.sidebar='hidden'}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Assistant:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/a11y-widget.js" data-anchor="#jsph-bubble-btn" data-hide-when="#jsph-panel.jsph-open, .sidebar.open" data-invert="img.logo" data-key="rp-a11y"></script>
  <script type="module" src="js/boot.js" blocking="render"></script>
</head>
<body data-nav="authority">
  <main>
    <h1>רשות המחקר · תמונת מצב לפי מקורות מימון</h1>
    <p class="muted" id="year"></p>
    <p class="muted small">תכנון מול ביצוע, בנפרד לכל מקור מימון. אין סיכום בין מקורות: כל כסף צבוע לייעוד ולקרן, ומחקרים במטבעות שונים אינם מחוברים.</p>
    <p class="asof muted" id="asof"></p>

    <div class="filters">
      <div class="view-toggle" id="mode" role="group" aria-label="תצוגה">
        <button type="button" class="btn vt" data-v="source" aria-pressed="true">לפי מקור מימון</button>
        <button type="button" class="btn vt" data-v="researcher" aria-pressed="false">לפי חוקר</button>
      </div>
      <label>מרכז מחקר
        <select id="dept"><option value="">הכול</option></select>
      </label>
      <label><input type="checkbox" id="risk"> חריגות וסיכונים בלבד</label>
    </div>
    <div class="legend-row"><div id="legend"></div><p class="muted small pace-key"><i class="pace-tick" aria-hidden="true"></i> הסימון על הפס: כמה מהתקופה כבר עברה. פס שעבר את הסימון מוציא מהר מהזמן, פס שמפגר אחריו מוציא לאט.</p></div>

    <div id="view" aria-live="polite"><div class="skel-block"></div></div>
    <p id="empty" hidden class="muted">אין פריטים התואמים את הסינון.</p>
  </main>
  <script type="module" src="js/authority.js"></script>
</body>
</html>
